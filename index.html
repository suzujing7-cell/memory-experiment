<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>記憶実験</title>
  <style>
    /* =========================================
       ベーススタイル (iPhone Safari 最適化)
       ========================================= */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      min-height: 100vh;
      box-sizing: border-box;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 30px;
      color: #1a73e8;
    }
    h2 {
      font-size: 20px;
      border-bottom: 2px solid #1a73e8;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      margin-bottom: 15px;
    }
    
    /* =========================================
       画面切り替え制御
       ========================================= */
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 画像提示画面は全画面黒背景にするための特殊処理 */
    #screen-stimulus.active {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 1000;
      padding: 0;
      margin: 0;
    }

    /* =========================================
       フォーム・UI要素
       ========================================= */
    .form-group {
      margin-bottom: 25px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .form-group label.question-title {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      font-size: 16px;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-row input {
      width: 80px;
      text-align: right;
    }
    
    /* 押しやすいラジオボタン */
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid #ccc;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .radio-group input[type="radio"] {
      display: none; /* デフォルトのラジオボタンを隠す */
    }
    /* 選択状態のスタイル */
    .radio-group input[type="radio"]:checked + span {
      font-weight: bold;
    }
    .radio-group label:has(input[type="radio"]:checked) {
      background-color: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
      font-weight: bold;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #1a73e8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 30px;
      margin-bottom: 30px;
      box-sizing: border-box;
    }
    .btn-primary:active {
      background-color: #1557b0;
    }
    .btn-primary:disabled {
      background-color: #9aa0a6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: #f1f3f4;
      color: #3c4043;
      margin-top: 15px;
    }

    /* =========================================
       各画面特有のスタイル
       ========================================= */
    #stimulus-image {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
    }
    
    .math-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    .math-problem {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      background: #f8f9fa;
      padding: 15px 5px;
      border-radius: 8px;
      border: 1px solid #e8eaed;
    }

    .question-block {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      background: #fff;
    }
    .q-text {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 15px;
    }
    .q-subtext {
      font-size: 14px;
      color: #5f6368;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    /* 自信度のラジオボタン群を横並びで綺麗に配置 */
    .conf-group label {
      padding: 10px 5px;
      flex: 1 1 14%;
    }
  </style>
</head>
<body>

  <!-- =========================================
       画面1: トップ画面（URL直アクセスの場合はスキップ）
       ========================================= -->
  <div id="screen-top" class="screen container">
    <h1>記憶実験</h1>
    <p>実験条件を選択してください。</p>
    <button class="btn-primary" onclick="startExperiment('with')">事前情報あり</button>
    <button class="btn-primary btn-secondary" onclick="startExperiment('without')">事前情報なし</button>
  </div>

  <!-- =========================================
       画面2: 実験前チェックリスト
       ========================================= -->
  <div id="screen-checklist" class="screen container">
    <h2>実験前チェック</h2>
    <p>実験を開始する前に、以下の項目にお答えください。</p>

    <div class="form-group">
      <label class="question-title">1. 前日の睡眠時間</label>
      <div class="input-row">
        <input type="number" id="chk-sleep" min="0" step="0.5"> 時間
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">2. 最後に食事をした時刻</label>
      <div class="input-row">
        <input type="number" id="chk-meal" min="0" max="24" step="1"> 時
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">3. 今日、運動をしましたか？</label>
      <div class="radio-group">
        <label><input type="radio" name="chk-exercise" value="yes"><span>はい</span></label>
        <label><input type="radio" name="chk-exercise" value="no"><span>いいえ</span></label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">4. 今日、カフェインを摂取しましたか？</label>
      <div class="radio-group">
        <label><input type="radio" name="chk-caffeine" value="yes"><span>はい</span></label>
        <label><input type="radio" name="chk-caffeine" value="no"><span>いいえ</span></label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">5. 現在の体調（5が非常に良い）</label>
      <div class="radio-group">
        <label><input type="radio" name="chk-health" value="1"><span>1</span></label>
        <label><input type="radio" name="chk-health" value="2"><span>2</span></label>
        <label><input type="radio" name="chk-health" value="3"><span>3</span></label>
        <label><input type="radio" name="chk-health" value="4"><span>4</span></label>
        <label><input type="radio" name="chk-health" value="5"><span>5</span></label>
      </div>
    </div>

    <div class="form-group">
      <label class="question-title">6. その他（結果に影響しそうな事項があれば）</label>
      <input type="text" id="chk-other" placeholder="空欄でもよい">
    </div>

    <button class="btn-primary" onclick="submitChecklist()">実験を開始する</button>
  </div>

  <!-- =========================================
       画面3: 事前情報（「あり条件」のみ表示）
       ========================================= -->
  <div id="screen-info" class="screen container">
    <div style="display:flex; flex-direction:column; justify-content:center; min-height:60vh;">
      <p style="font-size: 20px; text-align: center; font-weight: bold;">
        これから街中の画像を30秒間出します。出来るだけ何があったか覚えてください。
      </p>
      <button class="btn-primary" onclick="startStimulus()">次へ</button>
    </div>
  </div>

  <!-- =========================================
       画面4: 画像提示画面（30秒で自動遷移）
       ========================================= -->
  <div id="screen-stimulus" class="screen">
    <!-- 同階層に配置した stimulus.jpg を参照します -->
    <img id="stimulus-image" src="stimulus.jpg" alt="実験画像">
  </div>

  <!-- =========================================
       画面5: 計算課題（30秒で自動遷移）
       ========================================= -->
  <div id="screen-math" class="screen container">
    <h2>計算課題</h2>
    <p>以下の計算問題を見て、暗算を行ってください（入力欄はありません）。</p>
    <div id="math-problems-container" class="math-grid">
      <!-- JSで自動生成されます -->
    </div>
  </div>

  <!-- =========================================
       画面6: 記憶テスト（11問）
       ========================================= -->
  <div id="screen-test" class="screen container">
    <h2>記憶テスト</h2>
    <p>画像に関する以下の質問にお答えください。<br>すべての問題について「回答」と「自信度」の両方を選択してください。</p>

    <div id="test-questions-container">
      <!-- JSでHTML生成を行うことでコードを簡略化 -->
    </div>

    <button id="btn-submit-test" class="btn-primary" onclick="submitTest()">送信</button>
  </div>

  <!-- =========================================
       画面7: 終了画面
       ========================================= -->
  <div id="screen-finish" class="screen container">
    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:60vh; text-align:center;">
      <h2 style="border:none; color:#1a73e8; font-size:28px;">終了</h2>
      <p style="font-size:18px;">実験はすべて終了しました。<br>ご協力ありがとうございました。</p>
      <p style="color:#5f6368; margin-top:30px;">この画面を閉じて終了してください。</p>
    </div>
  </div>

  <!-- =========================================
       JavaScript ロジック
       ========================================= -->
  <script>
    // ==========================================
    // 設定項目 (本来 config.js に書く内容)
    // ==========================================
    // Google Apps ScriptのデプロイURLをここに貼り付けてください。
    // 空欄の場合は送信がスキップされ、UIのみ動作します。
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpekCkzWV0CHjtjo0PptMvKnZ5f-ny6xbO93NH3PaXRs9tU0600x81z6Zlkg5ubt0/exec";

    // ==========================================
    // 状態管理
    // ==========================================
    let experimentData = {
      sessionId: generateSessionId(),
      condition: '', // 'with' or 'without'
      sleepTime: null,
      lastMealTime: null,
      startTime: null,
      exercise: '',
      caffeine: '',
      health: '',
      other: '',
      stimulusDuration: 30, // 30秒固定
      mathStartTime: null,
      mathEndTime: null,
      answers: []
    };

    // 記憶テストの問題と正解定義
    const TEST_QUESTIONS = [
      { id: 1, text: "水色の自転車はありましたか？", isTrue: true },
      { id: 2, text: "緑色の建物はありましたか？", isTrue: true },
      { id: 3, text: "黄色の標識はありましたか？", isTrue: true },
      { id: 4, text: "ゴミ袋は4つありましたか？", isTrue: true },
      { id: 5, text: "寝ている猫はいましたか？", isTrue: true },
      { id: 6, text: "赤い虫はいましたか？", isTrue: true },
      { id: 7, text: "空に雲は2つありましたか？", isTrue: false },
      { id: 8, text: "電柱は3つありましたか？", isTrue: false },
      { id: 9, text: "太陽はありましたか？", isTrue: false },
      { id: 10, text: "男性は4人いましたか？", isTrue: false },
      { id: 11, text: "黒い鳥は1匹いましたか？", isTrue: false }
    ];

    // ==========================================
    // ユーティリティ関数
    // ==========================================
    function generateSessionId() {
      // ランダムな匿名セッションIDを生成 (10桁の英数字)
      return Math.random().toString(36).substring(2, 12);
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      window.scrollTo(0, 0);
    }

    // ==========================================
    // 初期化・ルーティング
    // ==========================================
    window.onload = () => {
      // URLパラメータ ?cond=with または ?cond=without があれば直接チェックリストへ
      const urlParams = new URLSearchParams(window.location.search);
      const cond = urlParams.get('cond');

      if (cond === 'with' || cond === 'without') {
        startExperiment(cond);
      } else {
        showScreen('screen-top');
      }
      
      renderTestQuestions();
    };

    function startExperiment(condition) {
      experimentData.condition = condition;
      showScreen('screen-checklist');
    }

    // ==========================================
    // 各画面の処理
    // ==========================================
    function submitChecklist() {
      const sleep = document.getElementById('chk-sleep').value;
      const meal = document.getElementById('chk-meal').value;
      const ex = document.querySelector('input[name="chk-exercise"]:checked');
      const caf = document.querySelector('input[name="chk-caffeine"]:checked');
      const health = document.querySelector('input[name="chk-health"]:checked');
      const other = document.getElementById('chk-other').value;

      // 「その他」以外は必須
      if (!sleep || !meal || !ex || !caf || !health) {
        alert("「その他」以外のすべての項目を入力・選択してください。");
        return;
      }

      experimentData.sleepTime = sleep;
      experimentData.lastMealTime = meal;
      experimentData.exercise = ex.value;
      experimentData.caffeine = caf.value;
      experimentData.health = health.value;
      experimentData.other = other;
      experimentData.startTime = new Date().toISOString(); // 実験開始時刻を自動記録

      if (experimentData.condition === 'with') {
        showScreen('screen-info'); // 事前情報あり条件
      } else {
        startStimulus(); // 事前情報なし条件（直接画像へ）
      }
    }

    function startStimulus() {
      showScreen('screen-stimulus');
      
      // 正確に30秒（30000ミリ秒）後に計算課題へ強制遷移
      setTimeout(() => {
        startMathTask();
      }, 30000);
    }

    function startMathTask() {
      generateMathProblems();
      experimentData.mathStartTime = new Date().toISOString();
      showScreen('screen-math');

      // 30秒（30000ミリ秒）後に記憶テストへ強制遷移
      setTimeout(() => {
        experimentData.mathEndTime = new Date().toISOString();
        showScreen('screen-test');
      }, 30000);
    }

    function generateMathProblems() {
      const container = document.getElementById('math-problems-container');
      container.innerHTML = '';
      // 1桁+1桁の簡単な足し算を20問生成
      for(let i = 0; i < 20; i++) {
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 9) + 1;
        const div = document.createElement('div');
        div.className = 'math-problem';
        div.innerText = `${a} ＋ ${b} ＝`;
        container.appendChild(div);
      }
    }

    // ==========================================
    // 記憶テストのレンダリングと送信
    // ==========================================
    function renderTestQuestions() {
      const container = document.getElementById('test-questions-container');
      
      TEST_QUESTIONS.forEach(q => {
        const block = document.createElement('div');
        block.className = 'question-block';
        
        block.innerHTML = `
          <p class="q-text">Q${q.id}. ${q.text}</p>
          
          <div class="radio-group">
            <label><input type="radio" name="q${q.id}_ans" value="true"><span>○</span></label>
            <label><input type="radio" name="q${q.id}_ans" value="false"><span>×</span></label>
          </div>
          
          <p class="q-subtext">自信度 (0=全く自信がない 〜 5=とても自信がある)</p>
          <div class="radio-group conf-group">
            <label><input type="radio" name="q${q.id}_conf" value="0"><span>0</span></label>
            <label><input type="radio" name="q${q.id}_conf" value="1"><span>1</span></label>
            <label><input type="radio" name="q${q.id}_conf" value="2"><span>2</span></label>
            <label><input type="radio" name="q${q.id}_conf" value="3"><span>3</span></label>
            <label><input type="radio" name="q${q.id}_conf" value="4"><span>4</span></label>
            <label><input type="radio" name="q${q.id}_conf" value="5"><span>5</span></label>
          </div>
        `;
        container.appendChild(block);
      });
    }

    function submitTest() {
      const answers = [];
      
      // バリデーションとデータ収集
      for (let i = 0; i < TEST_QUESTIONS.length; i++) {
        const q = TEST_QUESTIONS[i];
        const ansEl = document.querySelector(`input[name="q${q.id}_ans"]:checked`);
        const confEl = document.querySelector(`input[name="q${q.id}_conf"]:checked`);

        if (!ansEl || !confEl) {
          alert(`Q${q.id} の回答または自信度が選択されていません。\n11問すべてに入力してください。`);
          return;
        }

        const answerBool = ansEl.value === 'true';
        const isCorrect = answerBool === q.isTrue;

        answers.push({
          qId: q.id,
          answer: answerBool,
          confidence: parseInt(confEl.value, 10),
          isCorrect: isCorrect
        });
      }

      experimentData.answers = answers;
      sendDataToGAS();
    }

    function sendDataToGAS() {
      const btn = document.getElementById('btn-submit-test');
      btn.innerText = "送信中...";
      btn.disabled = true;

      // GAS URLが未設定の場合はエラーを出さずに終了画面へ（要件対応）
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.trim() === "") {
        console.warn("https://script.google.com/macros/s/AKfycbxpekCkzWV0CHjtjo0PptMvKnZ5f-ny6xbO93NH3PaXRs9tU0600x81z6Zlkg5ubt0/exec", experimentData);
        setTimeout(() => { showScreen('screen-finish'); }, 800);
        return;
      }

      // GASへPOSTリクエスト (CORS制約を回避するため mode: 'no-cors' を使用)
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(experimentData)
      })
      .then(() => {
        // no-cors の場合、成功/失敗のステータスコードは読めないがネットワークエラーがなければここに来る
        showScreen('screen-finish');
      })
      .catch((error) => {
        console.error("送信エラー:", error);
        alert("サーバーへの送信中にエラーが発生しました。");
        showScreen('screen-finish'); // エラーでも実験終了画面には進める
      });
    }
  </script>
</body>
</html>
